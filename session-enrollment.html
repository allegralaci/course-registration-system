<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Enrollment</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Course Registration System</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="course-search.html">Course Search</a>
        <a href="student-registration.html">Student Registration</a>
        <a href="instructor-schedule.html">Instructor Schedule</a>
        <a href="session-enrollment.html">Session Enrollment</a>
      </nav>
    </header>

    <main>
      <h2>Session Enrollment</h2>
      <p>
        View the list of students enrolled in a session. Accessible to
        authorized users only.
      </p>

      <div class="login-box">
        <h3>Authorized Access</h3>

        <label for="access-id">Instructor / Admin ID</label>
        <input type="text" id="access-id" placeholder="Enter ID" />

        <label for="access-password">Password</label>
        <input
          type="password"
          id="access-password"
          placeholder="Enter Password"
        />

        <button type="button">View Roster</button>
      </div>
    </main>
  </body>
</html>
