<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Schedule</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <script>requirePage();</script>
</head>

<body>

    <header>
        <h1>Course Registration System</h1>
   
<nav>
    <a href="index.html">Home</a>
    <a href="login.html">Log In</a>
    <a href="course-search.html">Course Search</a>
    <a href="course-details.html">Course Details</a>
    <a href="student-registration.html">Student Registration</a>
    <a href="instructor-schedule.html">Instructor Schedule</a>
    <a href="session-enrollment.html">Session Enrollment</a>
    <a href="my-schedule.html">My Schedule</a>
</nav>
    </header>

    <main>
        <h2>Instructor Schedule</h2>
        <p>Your assigned course sessions.</p>

        <p id="schedule-status">Loading your sessions...</p>

        <div class="schedule-section">
            <h3>Assigned Sessions</h3>

            <div id="schedule-results"></div>
        </div>

    </main>

    <script>
        // Shows the logged-in instructor's assigned sessions, read from the
        // database through GET /instructors/:id/sessions.
        async function loadSessions() {
            const status = document.getElementById("schedule-status");
            const results = document.getElementById("schedule-results");
            const user = getCurrentUser();

            if (!user || user.role !== "instructor" || !user.instructor_id) {
                status.textContent = "Please log in as an instructor to see your sessions.";
                return;
            }

            try {
                const response = await apiFetch(
                    "/instructors/" + encodeURIComponent(user.instructor_id) + "/sessions"
                );

                if (!response.ok) {
                    status.textContent =
                        (response.data.error && response.data.error.message) ||
                        "Could not load your sessions.";
                    return;
                }

                const sessions = response.data.sessions || [];

                results.innerHTML = "";

                if (sessions.length === 0) {
                    status.textContent = "You have no assigned sessions yet.";
                    return;
                }

                status.textContent =
                    "You are assigned to " + sessions.length + " session(s).";

                const table = document.createElement("table");
                const headerRow = document.createElement("tr");

                ["Course", "Section", "Days", "Time", "Location"].forEach(function(header) {
                    const th = document.createElement("th");
                    th.textContent = header;
                    headerRow.appendChild(th);
                });

                table.appendChild(headerRow);

                sessions.forEach(function(session) {
                    const row = document.createElement("tr");

                    // Text is set with textContent, so course names are never run as HTML.
                    const values = [
                        session.course.number + " - " + session.course.name,
                        session.section,
                        session.days,
                        session.time,
                        session.location
                    ];

                    values.forEach(function(value) {
                        const cell = document.createElement("td");
                        cell.textContent = value ?? "Not specified";
                        row.appendChild(cell);
                    });

                    table.appendChild(row);
                });

                results.appendChild(table);
            } catch (error) {
                // A 401 already sent the user to the login page.
                if (error.message !== "NOT_LOGGED_IN") {
                    console.error("Loading sessions failed:", error);
                    status.textContent = "Unable to load your sessions. Please try again.";
                }
            }
        }

        loadSessions();
    </script>

</body>
</html>
