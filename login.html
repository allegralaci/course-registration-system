<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Course Registration System</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>
    <header>
        <h1>Course Registration System</h1>
<nav>
    <a href="index.html">Home</a>
    <a href="login.html">Log In</a>
    <a href="course-search.html">Course Search</a>
    <a href="course-details.html">Course Details</a>
    <a href="student-registration.html">Student Registration</a>
    <a href="instructor-schedule.html">Instructor Schedule</a>
    <a href="session-enrollment.html">Session Enrollment</a>
</nav>
    </header>

    <main>
        <h2>Log In</h2>
        <p>Students, instructors, and administrators all log in here.</p>

        <form class="login-box" onsubmit="return handleLogin(event)">
            <h3>Log In</h3>

            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">

            <button type="submit">Log In</button>
        </form>

        <div id="login-message" class="message"></div>
    </main>

    <script>
        function showLoginMessage(text, type) {
            const message = document.getElementById("login-message");
            message.textContent = text;
            message.className = "message " + type;
            message.style.display = "block";
        }

        // Someone already logged in in this tab sees who it is.
        const alreadyLoggedIn = getCurrentUser();
        if (alreadyLoggedIn) {
            showLoginMessage(
                "You are logged in as " + displayName(alreadyLoggedIn) +
                ". Logging in again switches accounts.",
                "success"
            );
        }

        async function handleLogin(event) {
            event.preventDefault();

            const result = await attemptLogin(
                document.getElementById("username").value,
                document.getElementById("password").value
            );

            if (!result.ok) {
                showLoginMessage(result.error, "error");
                return false;
            }

            showLoginMessage("Login successful. Redirecting...", "success");
            location.href = pageAfterLogin(result.user.role);
            return false;
        }
    </script>
</body>
</html>
